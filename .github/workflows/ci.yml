name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Detect which paths changed ───────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      makefile: ${{ steps.filter.outputs.makefile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shell:
              - '**/*.sh'
              - '.config/zsh/**'
              - '.config/common/bin/**'
              - '.config/common/aliases'
              - 'scripts/**'
            makefile:
              - 'Makefile'

  # ── Super-Linter ─────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          FILTER_REGEX_EXCLUDE: '(.config/tmux/plugins/.*|.config/vscode/extensions\.json)'

  # ── makefile ─────────────────────────────────────────────────────────────────
  makefile:
    needs: changes
    if: needs.changes.outputs.makefile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Makefile targets parse correctly
        run: make --dry-run help

  # ── tests ─────────────────────────────────────────────────────────────────────
  tests:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get install -y zsh
      - name: Run ai-aliases tests
        run: make test-ai-aliases
      - name: Run tmux tests
        run: make test-tmux
