name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more (the lint status checks) ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Detect which paths changed ───────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      makefile: ${{ steps.filter.outputs.makefile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            shell:
              - '**/*.sh'
              - '.config/zsh/**'
              - '.config/common/bin/**'
              - '.config/common/aliases'
              - '.config/common/wt'
              - 'scripts/**'
            makefile:
              - 'Makefile'

  # ── Super-Linter ─────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Lint
        uses: super-linter/super-linter@12150456a73e248bdc94d0794898f94e23127c88 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read root-level linter configs (.editorconfig, .hadolint.yaml).
          LINTER_RULES_PATH: .
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          FILTER_REGEX_EXCLUDE: '(.config/tmux/plugins/.*|.config/vscode/.*\.json)'

  # ── makefile ─────────────────────────────────────────────────────────────────
  makefile:
    needs: changes
    if: needs.changes.outputs.makefile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Makefile targets parse correctly
        run: make --dry-run help

  # ── tests ─────────────────────────────────────────────────────────────────────
  tests:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install zsh and tmux
        run: sudo apt-get install -y zsh tmux
      - name: Configure dotfiles.d symlinks
        run: make configure-dotfiles-d
      - name: Configure tmux (sets base-index 1 required by tests)
        run: make configure-tmux
      - name: Run ai-aliases tests
        run: make test-ai-aliases
      - name: Run tmux tests
        run: make test-tmux
      - name: Run aws-keepalive tests
        run: make test-aws-keepalive
      - name: Run link tests
        run: make test-links
