[module/cpu]
type = internal/cpu
label = "  %percentage:2%%"
format = <label> [<ramp-coreload>]
format-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip cpu:}%{A2:$HOME/bin/system/polybar-details.sh cpu:}%{A3:$HOME/bin/system/polybar-details.sh cpu tip:}"
format-suffix = "%{A}%{A}%{A}"
format-background = ${colors.background}
format-padding = 1

# ramp.
ramp-coreload-spacing = 0.5
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █

