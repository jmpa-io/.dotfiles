[module/volume]
# one module for volume: click the speaker to mute, click the slider or number to shrink it,
# scroll to change it. (polybar-volume.sh does the work.)
type = custom/script
exec = "$HOME/bin/system/polybar-volume.sh status"
tail = true
label = %output%
format-padding = 0
click-middle = "$HOME/bin/system/polybar-details.sh volume"
click-right = "$HOME/bin/system/polybar-details.sh volume tip"
