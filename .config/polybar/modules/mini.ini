# Mini versions of the modules: same data, shorter labels. The bar shows these by default,
# and polybar-collapse.sh swaps them for the full modules when you click the chevron.

[module/xautolock-mini]
# left: details + actions, right: quick tooltip (polybar has no hover).
click-left = "$HOME/bin/system/polybar-collapse.sh flip xautolock"
click-middle = "$HOME/bin/system/polybar-details.sh xautolock"
click-right = "$HOME/bin/system/polybar-details.sh xautolock tip"
type = custom/script
exec = "$HOME/bin/system/polybar-xautolock-status.sh --mini"
interval = 0 ; prevent regular polling.
signal = 10
label = %output%

[module/temperature-mini]
type = internal/temperature
base-temperature = 30
label = "%temperature-c%"
format = <label>
format-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip temperature:}%{A2:$HOME/bin/system/polybar-details.sh temperature:}%{A3:$HOME/bin/system/polybar-details.sh temperature tip:}"
format-suffix = "%{A}%{A}%{A}"
format-padding = 1
warn-temperature = 55
label-warn = "%temperature-c%"
format-warn = <label-warn>
format-warn-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip temperature:}%{A2:$HOME/bin/system/polybar-details.sh temperature:}%{A3:$HOME/bin/system/polybar-details.sh temperature tip:}"
format-warn-suffix = "%{A}%{A}%{A}"
format-warn-foreground = ${colors.warning}
format-warn-padding = 1

[module/volume-mini]
# one module for volume: click the speaker to mute, click the number to expand, scroll to change it.
type = custom/script
exec = "$HOME/bin/system/polybar-volume.sh status --mini"
tail = true
label = %output%
format-padding = 0
click-middle = "$HOME/bin/system/polybar-details.sh volume"
click-right = "$HOME/bin/system/polybar-details.sh volume tip"

[module/cpu-mini]
type = internal/cpu
label = "  %percentage:2%%"
format = <label>
format-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip cpu:}%{A2:$HOME/bin/system/polybar-details.sh cpu:}%{A3:$HOME/bin/system/polybar-details.sh cpu tip:}"
format-suffix = "%{A}%{A}%{A}"
format-background = ${colors.background}
format-padding = 1

[module/memory-mini]
type = internal/memory
label = "  %percentage_used:2%%"
format = <label>
format-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip memory:}%{A2:$HOME/bin/system/polybar-details.sh memory:}%{A3:$HOME/bin/system/polybar-details.sh memory tip:}"
format-suffix = "%{A}%{A}%{A}"
format-background = ${colors.background}
format-padding = 1

[module/filesystem-mini]
click-right = "$HOME/bin/system/polybar-details.sh filesystem tip"
type = internal/fs
label-mounted = "%{A1:$HOME/bin/system/polybar-collapse.sh flip filesystem:}%{A2:$HOME/bin/system/polybar-details.sh filesystem:}%{A3:$HOME/bin/system/polybar-details.sh filesystem tip:}  %percentage_used%%%{A}%{A}%{A}"
format-mounted = "<label-mounted>"
format-mounted-background = ${colors.background}
format-mounted-padding = 1

[module/nordvpn-mini]
# left: details + actions, right: quick tooltip (polybar has no hover).
click-left = "$HOME/bin/system/polybar-collapse.sh flip nordvpn"
click-middle = "$HOME/bin/system/polybar-details.sh nordvpn"
click-right = "$HOME/bin/system/polybar-details.sh nordvpn tip"
type = custom/script
exec = "$HOME/bin/system/polybar-nordvpn-status.sh --mini"
tail = true
label = %output%
format-background = ${colors.background}
format-padding = 1

[module/tailscale-mini]
# left: details + actions, right: quick tooltip (polybar has no hover).
click-left = "$HOME/bin/system/polybar-collapse.sh flip tailscale"
click-middle = "$HOME/bin/system/polybar-details.sh tailscale"
click-right = "$HOME/bin/system/polybar-details.sh tailscale tip"
type = custom/script
exec = "$HOME/bin/system/polybar-tailscale-status.sh --mini"
interval = 5
label = %output%
format-background = ${colors.background}
format-padding = 1

[module/internet-mini]
type = internal/network
interface = wlp2s0
interface-type = wireless
label-disconnected = "no internet"
format-disconnected = <label-disconnected>
format-disconnected-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip internet:}%{A2:$HOME/bin/system/polybar-details.sh internet:}%{A3:$HOME/bin/system/polybar-details.sh internet tip:}"
format-disconnected-suffix = "%{A}%{A}%{A}"
format-disconnected-background = ${colors.disabled}
format-disconnected-padding = 1
label-connected = ""
format-connected = <label-connected>
format-connected-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip internet:}%{A2:$HOME/bin/system/polybar-details.sh internet:}%{A3:$HOME/bin/system/polybar-details.sh internet tip:}"
format-connected-suffix = "%{A}%{A}%{A}"
format-connected-background = ${colors.background}
format-connected-padding = 1

[module/date-mini]
type = internal/date
label = "  %time%"
format = <label>
format-prefix = "%{A1:$HOME/bin/system/polybar-collapse.sh flip date:}%{A2:$HOME/bin/system/polybar-details.sh date:}%{A3:$HOME/bin/system/polybar-details.sh date tip:}"
format-suffix = "%{A}%{A}%{A}"
format-padding = 1
date = %Y-%m-%d
time = %I:%M %p

