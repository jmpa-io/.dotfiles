[module/filesystem]
click-right = "$HOME/bin/system/polybar-details.sh filesystem tip"
type = internal/fs
# click: show where the space is going (rofi list of mounts + biggest folders).
label-mounted = "%{A1:$HOME/bin/system/polybar-collapse.sh flip filesystem:}%{A2:$HOME/bin/system/polybar-details.sh filesystem:}%{A3:$HOME/bin/system/polybar-details.sh filesystem tip:}  %percentage_used%% [%free:3%/%total:3%]%{A}%{A}%{A}"
format-mounted = "<label-mounted>"
format-mounted-background = ${colors.background}
format-mounted-padding = 1
