[module/collapse]
type = custom/script
exec = "$HOME/bin/system/polybar-collapse.sh chevron"
interval = 1
label = %output%
format-background = ${colors.background}
format-padding = 1
# left: mini <-> full.  middle: hide/show the modules you did not tick.  right: menu.
click-left = "$HOME/bin/system/polybar-collapse.sh toggle"
click-middle = "$HOME/bin/system/polybar-collapse.sh hide"
click-right = "$HOME/bin/system/polybar-collapse.sh menu"
