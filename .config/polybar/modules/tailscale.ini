[module/tailscale]
# left: details + actions, right: quick tooltip (polybar has no hover).
click-left = "$HOME/bin/system/polybar-collapse.sh flip tailscale"
click-middle = "$HOME/bin/system/polybar-details.sh tailscale"
click-right = "$HOME/bin/system/polybar-details.sh tailscale tip"
type = custom/script
exec = "$HOME/bin/system/polybar-tailscale-status.sh"
interval = 5
label = %output%
format-background = ${colors.background}
format-padding = 1
