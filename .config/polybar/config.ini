# colors.
[colors]
background = #282a36
background-alt = #bd93f9
foreground = #f8f8f2
foreground-alt = #a0a0a0
primary = #bd93f9
secondary = #ffb86c
alert = #ff5555
warning = #f1fa8c
warning-alt = #ffb86c
disabled = #6272a4

# modules.
include-file = $HOME/.config/polybar/modules/battery.ini
include-file = $HOME/.config/polybar/modules/collapse.ini
include-file = $HOME/.config/polybar/modules/cpu.ini
include-file = $HOME/.config/polybar/modules/date-and-time.ini
include-file = $HOME/.config/polybar/modules/filesystem.ini
include-file = $HOME/.config/polybar/modules/i3.ini
include-file = $HOME/.config/polybar/modules/internet.ini
include-file = $HOME/.config/polybar/modules/memory.ini
include-file = $HOME/.config/polybar/modules/mini.ini
include-file = $HOME/.config/polybar/modules/nordvpn.ini
include-file = $HOME/.config/polybar/modules/pulseaudio.ini
include-file = $HOME/.config/polybar/modules/tailscale.ini
include-file = $HOME/.config/polybar/modules/separator.ini
include-file = $HOME/.config/polybar/modules/temperature.ini
include-file = $HOME/.config/polybar/modules/xautolock.ini

# bar.
[bar/top]
monitor = ${env:MONITOR:}
enable-ipc = true
width = 100%
height = 32

# theme.
background = ${colors.background}
foreground = ${colors.foreground}
separator = "|"
separator-foreground = #6272a5
cursor-click = pointer
line-size = 2
padding-left = 0
padding-right = 1

# modules order + format.
modules-left = separator i3
modules-right = collapse xautolock xautolock-mini temperature temperature-mini volume volume-mini cpu cpu-mini memory memory-mini filesystem filesystem-mini nordvpn nordvpn-mini tailscale tailscale-mini internet internet-mini date date-mini battery separator
module-margin-right = 0
module-margin-left = 0

# fonts.
include-file = $HOME/.config/polybar/fonts.ini
