# ── General ───────────────────────────────────────────────────────────────────

# Use Ctrl+B as prefix (default — no conflicts on macOS)
set -g prefix C-b
bind C-b send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse support
set -g mouse on
set -g allow-passthrough on

# Increase scrollback buffer
set -g history-limit 50000

# No delay for escape key
set -sg escape-time 0

# Focus events for Neovim autoread/focus detection
set -g focus-events on

# Stop small clients from shrinking windows when multiple clients attach
set -g aggressive-resize on

# Show status messages for 2s (default 750ms is too fast to read)
set -g display-time 2000

# Refresh status bar every 5s
set -g status-interval 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Rebind ? to list keys (was unbound)
unbind ?
bind ? list-keys

# ── Splits (no prefix needed) ─────────────────────────────────────────────────

bind -n C-\\ split-window -h -c "#{pane_current_path}"   # Ctrl+\  → split right
bind -n C-g  split-window -v -c "#{pane_current_path}"   # Ctrl+G  → split down
unbind '"'
unbind %

# Keep prefix versions too
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ── Navigation (no prefix needed) ─────────────────────────────────────────────

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n S-Left  previous-window
bind -n S-Right next-window

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

# ── Windows ───────────────────────────────────────────────────────────────────

# Rename windows to show running command (not just 'zsh')
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'

# Highlight windows with activity in the status bar
set -g monitor-activity on
set -g visual-activity off

# ── Pane sync ─────────────────────────────────────────────────────────────────

# Ctrl+B y — toggle sync, show pane borders when on so you can't miss it
bind y \
  setw synchronize-panes \; \
  if-shell "[ \"$(tmux showw -v synchronize-panes)\" = 'on' ]" \
    "set -g pane-border-style fg=colour196 ; set -g pane-active-border-style fg=colour196,bold ; display 'Sync ON ⚠️  — typing goes to ALL panes'" \
    "set -g pane-border-style fg=colour238,bg=colour235 ; set -g pane-active-border-style fg=colour141,bold,bg=colour235 ; display 'Sync OFF'"

set -g pane-border-status bottom
# The ══ at the end is hardcoded box-drawing characters styled to match the border colour.
# tmux has no native way to add right-side padding to an align=right format string, so we
# fake it by appending border-coloured double lines — it's invisible against the border.
set -g pane-border-format "#[align=right]#{?pane_active,#[fg=colour234 bg=colour220 nobold],#[fg=white bg=colour204 nobold]} #{session_name}:#{window_index}.#{pane_index} #[default]#{?pane_active,#[fg=colour141],#[fg=colour238]}══"



# ── Floating scratchpad ───────────────────────────────────────────────────────

# Ctrl+B t — summon/dismiss a floating terminal popup
bind t display-popup -E -w 80% -h 75% -x C -y C \
  "tmux new-session -A -s scratch"

# ── Session switcher (fzf) ────────────────────────────────────────────────────

# Ctrl+B s — fuzzy switch between sessions (shows pane count + commands)
bind s display-popup -E -w 60 -h 20 \
  "tmux list-sessions -F '#{session_name} #{session_attached}' \
   | while read -r name attached; do \
       panes=\$(tmux list-panes -t \"\$name\" -a -F '#{pane_id}' 2>/dev/null | wc -l | tr -d ' '); \
       cmds=\$(tmux list-panes -t \"\$name\" -a -F '#{pane_current_command}' 2>/dev/null \
              | sort | uniq -c | sort -rn \
              | awk '{printf \"%s×%s \",\$1,\$2}' | sed 's/ \$//'); \
       marker=\$([ \"\$attached\" -gt 0 ] && echo '●' || echo ' '); \
       printf '%s %s [%sp] %s\n' \"\$marker\" \"\$name\" \"\$panes\" \"\$cmds\"; \
     done \
   | fzf --prompt='session: ' \
         --color='bg:#282a36,fg:#f8f8f2,border:#bd93f9,prompt:#bd93f9,pointer:#ff79c6,hl:#50fa7b' \
         --border=rounded \
   | awk '{print \$2}' \
   | xargs -r tmux switch-client -t"

# ── Copy mode ─────────────────────────────────────────────────────────────────

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
   elif command -v xclip >/dev/null 2>&1; then xclip -sel clip; \
   elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; fi"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
  "if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
   elif command -v xclip >/dev/null 2>&1; then xclip -sel clip; \
   elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; fi"

# ── Clipboard ─────────────────────────────────────────────────────────────────

# Paste from system clipboard with Ctrl+B p (macOS: pbpaste, Linux: xclip/xsel)
bind p run "{ \
  if command -v pbpaste >/dev/null 2>&1; then pbpaste; \
  elif command -v xclip >/dev/null 2>&1; then xclip -sel clip -o; \
  elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --output; fi; \
  } | tmux load-buffer - && tmux paste-buffer"

# ── Appearance ────────────────────────────────────────────────────────────────

# 256 colour + true colour support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── Plugins ───────────────────────────────────────────────────────────────────

# Set plugin install path so TPM and all plugins live under ~/.config/tmux/
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Morantron/tmux-fingers'

# Dracula
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "cwd custom:time_custom"
set -g @dracula-show-timezone false
set -g @dracula-custom-plugin-colors "dark_purple white"
set -g @dracula-cwd-colors "yellow dark_gray"
set -g @dracula-cwd-current-dir true

# Resurrect — save and restore sessions across reboots
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"claude->claude --continue"'

# Hook disabled — inline strategy above handles claude/opencode restore
# set -g @resurrect-hook-post-restore-all 'run-shell "~/go/src/github.com/jmpa-io/mcps/bin/resurrect-claude.sh hook"'

# Ctrl+B A — AI session inspector popup (requires jmpa-io/mcps repo to be cloned)
if "test -f ~/go/src/github.com/jmpa-io/mcps/bin/resurrect-claude.sh" \
  "bind A display-popup -E -w 90 -h 30 -x C -y C '~/go/src/github.com/jmpa-io/mcps/bin/resurrect-claude.sh status'"

# Continuum — auto-save every 15 minutes, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Bootstrap TPM if not installed
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'

# Must be after TPM — overrides Dracula's border colours
set -g pane-border-lines double
set -g pane-border-style "fg=colour238,bg=colour235"
set -g pane-active-border-style "fg=colour141,bold,bg=colour235"

# Dim inactive pane text slightly — bg intentionally omitted so background is never changed
set -g window-style "fg=colour248,bg=colour235"
set -g window-active-style "fg=colour255,bg=#282a36"

