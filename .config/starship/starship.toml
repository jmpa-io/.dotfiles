# https://starship.rs/config
# Dracula palette — matches WezTerm (Dracula Official), tmux (dracula/tmux),
# and nvim (chadracula) so the whole terminal stack looks like one thing.
#   background #282a36  current-line #44475a  foreground #f8f8f2
#   comment    #6272a4  cyan #8be9fd  green #50fa7b  orange #ffb86c
#   pink       #ff79c6  purple #bd93f9  red #ff5555  yellow #f1fa8c

add_newline = false
command_timeout = 100

# Explicitly define the prompt format - anything not listed here won't show.
# This is cleaner than disabling every language module individually.
format = """
$directory$git_branch$git_status$cmd_duration
$time$character"""

[character]
success_symbol = "[❯](bold #50fa7b)"
error_symbol = "[❯](bold #ff5555)"

[cmd_duration]
min_time = 1_000
format = "[ $duration]($style) "
style = "bold #ffb86c"

[directory]
truncation_symbol = ""
home_symbol = "~"
format = "[ $path]($style)[$read_only]($read_only_style) "
truncation_length = 4
style = "bold #8be9fd"
read_only = " "
read_only_style = "bold #ff5555"

[git_branch]
symbol = " "
style = "bold #bd93f9"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #ff79c6"
format = '([\[$all_status$ahead_behind\]]($style)) '

[time]
disabled = false
format = "[ $time]($style) "
time_format = "%H:%M:%S"
style = "bold #6272a4"
